<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>résumé on the fly</title>
<style>
  :root { --bg: #fff7e8; --fg: #1d1a16; --dim: #8c8173; --faint: #f0e2c8; --wall: #00a99d; --player: #ff2e88; --dot: #ff7a00; --bug1: #ffb800; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #f5f0e6; --dim: #8a8580; --faint: #2a2a2a; --wall: #19d3c5; --player: #ff3d94; --dot: #ffd400; --bug1: #ff7a00; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); overscroll-behavior: none; }
  body {
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  #board { display: block; width: 100%; height: 100%; }

  .hud {
    position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
    padding: max(14px, env(safe-area-inset-top)) 18px 34px;
    background: linear-gradient(color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 55%, transparent) 60%, transparent);
    transition: opacity .6s;
  }
  .hud.empty { opacity: 0; }
  .hud > div { max-width: 1000px; margin: 0 auto; }
  .status { display: flex; justify-content: flex-end; font-size: 14px; color: var(--dim); }
  .count { font-variant-numeric: tabular-nums; }
  .line { margin: 2px 0 0; font-size: 26px; line-height: 1.45; min-height: 1.45em; font-weight: 600; letter-spacing: -0.3px; }
  .line span.landed { animation: pop .5s ease-out; }
  @keyframes pop { from { color: var(--dot); } to { color: var(--fg); } }
  @media (max-width: 520px) { .line, .fly { font-size: 18px; } }
  .tip { position: absolute; left: 50%; bottom: max(34px, env(safe-area-inset-bottom)); transform: translate(-50%, 8px); padding: 10px 18px; border-radius: 22px;
         font-size: 15px; width: max-content; max-width: calc(100vw - 32px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s, transform .5s;
         background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .tip.on { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) { .tip { font-size: 13px; } }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    text-align: center; padding: 12vh 24px 24px; cursor: pointer;
  }
  .card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 30px 36px; border-radius: 16px;
          background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .overlay[hidden] { display: none; }
  h1 { margin: 0; font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 30px; line-height: 1.2; font-weight: 400;
       letter-spacing: 1px; text-shadow: 3px 3px 0 var(--faint); margin-bottom: 14px; }
  h1 span { white-space: nowrap; }
  .overlay strong { font-size: 17px; font-weight: 600; }
  .overlay span { color: color-mix(in srgb, var(--fg) 70%, transparent); font-size: 13px; max-width: 48ch; }
  @media (max-width: 520px) { h1 { font-size: 16px; } }

  .final { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; padding: 8%; text-align: center; pointer-events: none;
           background: color-mix(in srgb, var(--bg) 84%, transparent); animation: fade .9s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .final[hidden] { display: none; }
  .final p { margin: 0; max-width: 940px; font-size: 34px; line-height: 1.45; font-weight: 600; letter-spacing: -0.5px; }
  .final small { color: var(--dim); font-size: 13px; opacity: 0; transition: opacity .6s; }
  .final small.on { opacity: 1; }
  @media (max-width: 520px) { .final p { font-size: 21px; } }
  .fly { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 10; white-space: nowrap;
         font: 600 26px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -0.3px; color: var(--dot); }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="board" aria-label="A small bird flying around a quiet, sunlit house. Each bubble it pops adds a word to a resume."></canvas>

  <div class="hud empty" id="hud"><div>
    <div class="status"><span class="count" id="count"></span></div>
    <p class="line" id="line" aria-live="polite"></p>
  </div></div>

  <div class="tip" id="tip"></div>
  <div class="final" id="final" hidden></div>
  <div class="overlay" id="overlay"><div class="card">
    <h1 id="logo">résumé on the fly</h1>
    <strong id="title">A small bird in a quiet house.</strong>
    <span id="sub"></span>
    <span id="hint"></span>
  </div></div>
</main>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";

const LINE = "Dhan Somaiah. Computer engineering 2018-23. Performance marketing intern 2023. Web developer since. Now: AI web apps, custom harnesses, data pipelines, model evals.";
const WORDS = LINE.split(" ");

const $ = (id) => document.getElementById(id);
const canvas = $("board"), overlay = $("overlay"), titleEl = $("title"), subEl = $("sub"), hintEl = $("hint");
const finalEl = $("final"), countEl = $("count"), lineEl = $("line"), hudEl = $("hud"), tipEl = $("tip");
{
  const logo = $("logo"), hues = ["--wall", "--player", "--dot", "--bug1"];
  const name = logo.textContent; let i = 0; logo.innerHTML = "";
  name.split(" ").forEach((word, n) => {                 // a colour for each letter, and words that stay whole when the line wraps
    if (n) logo.append(" ");
    const w = document.createElement("span");
    for (const ch of word) { const s = document.createElement("span"); s.textContent = ch; s.style.color = `var(${hues[i++ % hues.length]})`; w.append(s); }
    logo.append(w);
  });
  logo.setAttribute("aria-label", name);
}
const TOUCH = matchMedia("(pointer: coarse)").matches;
const GO = TOUCH ? "Tap to begin." : "Click to begin.";
const ON = TOUCH ? "Tap to carry on." : "Click or press a key to carry on.";
subEl.textContent = GO;
hintEl.textContent = "";

function random(seed) {                                // the same house every time
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = random(4);
const pick = (a) => a[Math.floor(rand() * a.length)];

// ---- the scene -----------------------------------------------------------------------------------

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { titleEl.textContent = "This needs WebGL."; subEl.textContent = "Your browser couldn't start 3D graphics."; hintEl.textContent = ""; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 300);
scene.add(camera);

// The house: 14 by 10, walls 3 high, a pitched roof with its ridge running east to west.
const HX = 7, HZ = 5, H = 3, RIDGE = 5.4, SLOPE = (RIDGE - H) / HZ, T = 0.3;
const R = 0.16;                                        // how big the bird is, for bumping into things
const SUN = new THREE.Vector3(0.5, -0.42, -0.76).normalize();      // the way the light travels: low, from the south-west
const roofAt = (z) => RIDGE - SLOPE * Math.abs(z);

const mats = new Map();
const mat = (color, o) => {
  if (o) return new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, ...o });
  if (!mats.has(color)) mats.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0 }));
  return mats.get(color);
};
function texture(size, paint, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  paint(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}
const planks = (base, seam, n) => (g, s) => {
  const h = s / n;
  for (let i = 0; i < n; i++) {
    const v = 0.86 + rand() * 0.22;
    g.fillStyle = `rgb(${base.map((c) => Math.min(255, c * v) | 0)})`; g.fillRect(0, i * h, s, h);
    g.fillStyle = seam;
    g.fillRect(0, i * h, s, 2);
    const cut = rand() * s; g.fillRect(cut, i * h, 2, h); g.fillRect((cut + s * 0.55) % s, i * h, 2, h);
    g.globalAlpha = 0.05;                                            // a little grain
    for (let k = 0; k < 14; k++) g.fillRect(rand() * s, i * h + rand() * h, 40 + rand() * 120, 1);
    g.globalAlpha = 1;
  }
};

const soft = texture(64, (g, s) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.35, "rgba(255,255,255,.45)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, s, s); });

const WOOD = 0x9a6a41, DARK = 0x80583a, PALE = 0xc79a66, CREAM = 0xf3e6cf;
const wallMat = mat(CREAM), wood = mat(WOOD), dark = mat(DARK), pale = mat(PALE);
const solids = [];                                     // boxes the bird can't fly through, and can land on

function box(w, h, d, x, y, z, m, o = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = o.cast !== false; mesh.receiveShadow = true;
  if (o.rx) mesh.rotation.x = o.rx; if (o.ry) mesh.rotation.y = o.ry; if (o.rz) mesh.rotation.z = o.rz;
  (o.to || scene).add(mesh);
  if (o.solid) solids.push([x - w / 2, y - h / 2, z - d / 2, x + w / 2, y + h / 2, z + d / 2]);
  return mesh;
}
const stand = (w, h, d, x, y0, z, m, o) => box(w, h, d, x, y0 + h / 2, z, m, o);      // a box sitting on height y0
function round(r0, r1, h, x, y0, z, m, o = {}) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, o.sides || 14), m);
  mesh.position.set(x, y0 + h / 2, z); mesh.castShadow = o.cast !== false; mesh.receiveShadow = true; (o.to || scene).add(mesh);
  if (o.solid) solids.push([x - r1, y0, z - r1, x + r1, y0 + h, z + r1]);
  return mesh;
}
function ball(r, x, y, z, m, o = {}) {
  const mesh = new THREE.Mesh(o.smooth ? new THREE.SphereGeometry(r, 14, 10) : new THREE.IcosahedronGeometry(r, 1), m);
  mesh.position.set(x, y, z); if (o.scale) mesh.scale.set(...o.scale); mesh.castShadow = o.cast !== false; mesh.receiveShadow = true;
  (o.to || scene).add(mesh); return mesh;
}

// floor
{
  const m = mat(0xffffff, { map: texture(512, planks([186, 134, 86], "rgba(70,40,15,.55)", 8), 11, 8), roughness: 0.75 });
  const f = new THREE.Mesh(new THREE.PlaneGeometry(2 * HX + 1, 2 * HZ + 1), m);
  f.rotation.x = -Math.PI / 2; f.receiveShadow = true; scene.add(f);
}

// Walls, with windows and doors cut out of them. Every opening is open: the bird can come and go as it likes.
const panes = [], sunHoles = [];                       // the openings the sun comes through
function wall(along, at, out, holes, sunny) {
  const half = along === "x" ? HX + T : HZ, mid = at + out * T / 2;
  const place = (u, y, len, h, dep, m, off = 0, o) => along === "x" ? box(len, h, dep, u, y, mid + off, m, o) : box(dep, h, len, mid + off, y, u, m, o);
  const piece = (u0, u1, y0, y1) => { if (u1 - u0 > 0.01 && y1 - y0 > 0.01) place((u0 + u1) / 2, (y0 + y1) / 2, u1 - u0, y1 - y0, T, wallMat, 0, { solid: true }); };
  const p = (u, y) => along === "x" ? new THREE.Vector3(u, y, at) : new THREE.Vector3(at, y, u);
  let cursor = -half;
  for (const { c, w, y0, y1, door } of holes.sort((a, b) => a.c - b.c)) {
    piece(cursor, c - w / 2, 0, H); piece(c - w / 2, c + w / 2, 0, y0); piece(c - w / 2, c + w / 2, y1, H);
    cursor = c + w / 2;
    if (sunny) sunHoles.push({ along, c, w, y0, y1 });
    const yc = (y0 + y1) / 2, hh = y1 - y0;
    place(c, y1 - 0.035, w, 0.07, 0.12, dark);
    place(c - w / 2 + 0.035, yc, 0.07, hh, 0.12, dark); place(c + w / 2 - 0.035, yc, 0.07, hh, 0.12, dark);
    if (door) {
      for (const side of door) {                       // the leaves, swung wide open
        const len = door.length > 1 ? w / 2 : w, du = side * 0.35, dv = out * 0.94;
        const leaf = place(c + side * w / 2 + du * len / 2, yc, len - 0.04, hh - 0.08, 0.045, wood, out * T / 2 + dv * len / 2);
        leaf.rotation.y = along === "x" ? Math.atan2(-dv, du) : Math.atan2(dv, du);
      }
      if (sunny) for (const [ua, ub] of [[c - w / 2 + 0.07, c - 0.02], [c + 0.02, c + w / 2 - 0.07]]) panes.push([p(ua, 0.02), p(ub, 0.02), p(ub, y1 - 0.07), p(ua, y1 - 0.07)]);
      continue;
    }
    place(c, y0 + 0.035, w, 0.07, 0.12, dark);
    place(c, yc, 0.045, hh, 0.06, dark); place(c, yc, w, 0.045, 0.06, dark);
    place(c, y0 - 0.03, w + 0.3, 0.05, 0.3, wood, -out * (T / 2 + 0.1));           // the sill, inside
    if (sunny) for (const [ua, ub] of [[c - w / 2 + 0.07, c - 0.03], [c + 0.03, c + w / 2 - 0.07]])
      for (const [ya, yb] of [[y0 + 0.07, yc - 0.03], [yc + 0.03, y1 - 0.07]]) panes.push([p(ua, ya), p(ub, ya), p(ub, yb), p(ua, yb)]);
  }
  piece(cursor, half, 0, H);
}
wall("x", HZ, 1, [{ c: -4, w: 1.6, y0: 0.9, y1: 2.4 }, { c: 0, w: 1.8, y0: 0, y1: 2.3, door: [-1, 1] }, { c: 4, w: 1.6, y0: 0.9, y1: 2.4 }], true);
wall("x", -HZ, -1, [{ c: 4.5, w: 1.2, y0: 1.1, y1: 2.3 }]);
wall("z", -HX, -1, [{ c: 1.8, w: 1.4, y0: 0.95, y1: 2.35 }], true);
wall("z", HX, 1, [{ c: -2, w: 1.3, y0: 1.0, y1: 2.3 }, { c: 2.7, w: 0.95, y0: 0, y1: 2.05, door: [1] }]);

// the gable ends, the west one with a round window high up
const PORT = { y: 4.05, r: 0.52 };
for (const side of [-1, 1]) {
  const s = new THREE.Shape([new THREE.Vector2(-HZ - T, H), new THREE.Vector2(HZ + T, H), new THREE.Vector2(0, RIDGE + T * SLOPE + 0.1)]);
  if (side < 0) { const hole = new THREE.Path(); hole.absarc(0, PORT.y, PORT.r, 0, Math.PI * 2, true); s.holes.push(hole); }
  const g = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: T, bevelEnabled: false, curveSegments: 20 }), wallMat);
  g.rotation.y = -Math.PI / 2; g.position.x = side < 0 ? -HX : HX + T; g.castShadow = g.receiveShadow = true; scene.add(g);
}
{
  const ring = new THREE.Mesh(new THREE.TorusGeometry(PORT.r, 0.045, 8, 28), dark);
  ring.rotation.y = Math.PI / 2; ring.position.set(-HX - 0.1, PORT.y, 0); ring.castShadow = true; scene.add(ring);
  box(0.06, 2 * PORT.r, 0.04, -HX - 0.1, PORT.y, 0, dark); box(0.06, 0.04, 2 * PORT.r, -HX - 0.1, PORT.y, 0, dark);
  for (let q = 0; q < 4; q++) {                        // four wedges of light
    const pts = [new THREE.Vector3(-HX, PORT.y, 0)];
    for (let i = 0; i <= 5; i++) {
      const a = q * Math.PI / 2 + 0.06 + i / 5 * (Math.PI / 2 - 0.12);
      pts.push(new THREE.Vector3(-HX, PORT.y + Math.sin(a) * (PORT.r - 0.05), Math.cos(a) * (PORT.r - 0.05)));
    }
    panes.push(pts);
  }
}

// roof, rafters, and the beams the bird can weave between
const roofMat = mat(0xffffff, { map: texture(512, planks([214, 168, 118], "rgba(70,45,20,.45)", 8), 6, 4) });
const TILT = Math.atan(SLOPE);
for (const side of [-1, 1]) {
  const len = (HZ + 0.9) / Math.cos(TILT), zc = side * (HZ + 0.9) / 2;
  box(2 * HX + 1.4, 0.2, len, 0, roofAt(zc) + 0.1 * Math.cos(TILT), zc + side * 0.1 * Math.sin(TILT), roofMat, { rx: side * TILT });
  box(2 * HX + 1.5, 0.07, len + 0.1, 0, roofAt(zc) + 0.235 * Math.cos(TILT), zc + side * 0.235 * Math.sin(TILT), mat(0xa25c48), { rx: side * TILT });
}
box(2 * HX, 0.18, 0.18, 0, RIDGE - 0.13, 0, dark);
for (const x of [-5.6, -2.8, 0, 2.8, 5.6]) {
  box(0.18, 0.2, 2 * HZ, x, H, 0, dark, { solid: true });
  box(0.16, RIDGE - H - 0.3, 0.16, x, (H + 0.1 + RIDGE - 0.2) / 2, 0, dark, { solid: true });
  for (const side of [-1, 1]) box(0.12, 0.14, HZ / Math.cos(TILT), x, roofAt(HZ / 2) - 0.09, side * HZ / 2, dark, { rx: side * TILT });
}
// skirting boards
box(2 * HX, 0.12, 0.03, 0, 0.06, -HZ + 0.015, pale, { cast: false }); box(0.03, 0.12, 2 * HZ, -HX + 0.015, 0.06, 0, pale, { cast: false });
for (const s of [-1, 1]) box(HX - 0.9, 0.12, 0.03, s * (HX + 0.9) / 2, 0.06, HZ - 0.015, pale, { cast: false });
box(0.03, 0.12, HZ + 2.225, HX - 0.015, 0.06, (2.225 - HZ) / 2, pale, { cast: false }); box(0.03, 0.12, HZ - 3.175, HX - 0.015, 0.06, (HZ + 3.175) / 2, pale, { cast: false });

// ---- furniture -------------------------------------------------------------------------------------

function legs(w, d, h, x, z, m, t = 0.06) {
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) stand(t, h, t, x + sx * (w / 2 - t), 0, z + sz * (d / 2 - t), m);
}
function chair(x, z, facing, m = wood) {                // facing: which way the sitter looks, along z
  legs(0.42, 0.42, 0.44, x, z, m, 0.04);
  stand(0.44, 0.05, 0.44, x, 0.44, z, m);
  stand(0.44, 0.52, 0.05, x, 0.49, z - facing * 0.2, m);
  solids.push([x - 0.22, 0, z - 0.22, x + 0.22, 0.49, z + 0.22], [x - 0.22, 0.49, z - facing * 0.2 - 0.03, x + 0.22, 1.01, z - facing * 0.2 + 0.03]);
}
function plant(x, y0, z, size, greens = [0x6f9a5a, 0x86ad62, 0x5c8650]) {
  round(0.6 * size, 0.45 * size, 0.7 * size, x, y0, z, mat(0xc27a52));
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2, r = (i % 2 ? 0.55 : 0.3) * size;
    ball(0.55 * size, x + Math.cos(a) * r, y0 + (0.95 + (i % 3) * 0.3) * size, z + Math.sin(a) * r, mat(greens[i % 3], { flatShading: true }), { scale: [1, 1.5, 1] });
  }
}

// a table in the sun, laid for nobody in particular
{
  const x = 2.8, z = 2;
  stand(1.7, 0.07, 0.95, x, 0.73, z, wood, { solid: true }); legs(1.7, 0.95, 0.73, x, z, wood, 0.07);
  chair(x - 0.35, z + 0.72, -1); chair(x + 0.35, z - 0.72, 1);
  round(0.05, 0.07, 0.2, x - 0.5, 0.8, z - 0.25, mat(0x7fa3b8, { roughness: 0.4 }));
  [0xe7a23c, 0xd9655b, 0xf2d06b, 0xe58fa0, 0xf5f0e0].forEach((c, i) => {
    const a = i * 1.26, r = 0.07;
    round(0.006, 0.006, 0.2, x - 0.5 + Math.cos(a) * r * 0.5, 1.0, z - 0.25 + Math.sin(a) * r * 0.5, mat(0x5c8650), { cast: false, sides: 5 });
    ball(0.045, x - 0.5 + Math.cos(a) * r, 1.2 + (i % 2) * 0.04, z - 0.25 + Math.sin(a) * r, mat(c, { flatShading: true }));
  });
  solids.push([x - 0.62, 0.8, z - 0.37, x - 0.38, 1.27, z - 0.13]);

let state = "ready", eaten = 0, last, endAt, restAt = -1e9, locked = false;

function renderLine(from) {
  for (let i = lineEl.children.length; i < eaten; i++) {
    if (i) lineEl.append(" ");
    const s = document.createElement("span"); s.textContent = WORDS[i]; lineEl.append(s);
    if (from) fly(s, from); else s.className = "landed";
  }
  countEl.textContent = `${eaten}/${WORDS.length}`; hudEl.classList.toggle("empty", !eaten);
}

// The word leaves the bubble, arcs across the screen and lands in its place in the line.
const middle = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });

function flight(text, from, to, { s0 = 1, s1 = 1, pop = false, delay = 0, dur = 850, done }) {
  const f = document.createElement("div"); f.className = "fly"; f.textContent = text;
  document.body.append(f);
  const put = (x, y, s, r) => `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s}) rotate(${r}deg)`;
  const lift = Math.min(90, 30 + Math.abs(to.y - from.y) * 0.25);
  const frames = pop
    ? [{ transform: put(from.x, from.y, 0.3, -8), opacity: 0 },
       { transform: put(from.x, from.y - 18, 1.5, 4), opacity: 1, offset: 0.22 }]
    : [{ transform: put(from.x, from.y, s0, 0), opacity: 1 }];
  frames.push({ transform: put((from.x + to.x) / 2, Math.min(from.y, to.y) - lift, (s0 + s1) / 2 * 1.15, -3), opacity: 1, offset: 0.6 },
              { transform: put(to.x, to.y, s1, 0), opacity: 1 });
  const a = f.animate(frames, { duration: dur, delay, easing: "cubic-bezier(.25,.6,.3,1)", fill: "backwards" });
  a.onfinish = () => { f.remove(); done && done(); };
  return a;
}

function fly(span, from) {                              // from the bubble to its place in the line
  span.style.visibility = "hidden";
  let p = from.clone().project(camera);
  if (p.z > 1 || Math.abs(p.x) > 1 || Math.abs(p.y) > 1) p = pos.clone().project(camera);      // popped out of sight: it comes from the bird
  flight(span.textContent, { x: (p.x + 1) / 2 * window.innerWidth, y: (1 - p.y) / 2 * window.innerHeight }, middle(span.getBoundingClientRect()),
         { pop: true, dur: 1000, done: () => { span.style.visibility = ""; span.className = "landed"; } });
}

// the line -> the whole resume, across the screen
function transpose() {
  const p = document.createElement("p"), note = document.createElement("small");
  note.textContent = TOUCH ? "tap to keep flying" : "click or press a key to keep flying";
  const spots = WORDS.map((w, i) => {
    if (i) p.append(" ");
    const s = document.createElement("span"); s.textContent = w; s.style.visibility = "hidden"; p.append(s); return s;
  });
  finalEl.innerHTML = ""; finalEl.append(p, note); finalEl.hidden = false;
  const scale = parseFloat(getComputedStyle(p).fontSize) / parseFloat(getComputedStyle(lineEl).fontSize);
  [...lineEl.querySelectorAll("span")].forEach((src, i) => {
    const a = middle(src.getBoundingClientRect()), b = middle(spots[i].getBoundingClientRect());
    flight(WORDS[i], a, b, { s0: 1, s1: scale, delay: i * 55, dur: 900,
      done: () => { spots[i].style.visibility = ""; if (i === WORDS.length - 1) note.classList.add("on"); } });
    setTimeout(() => { src.style.visibility = "hidden"; }, i * 55);
  });
}

// ---- flying ----------------------------------------------------------------------------------------------

const pos = new THREE.Vector3(3.45, 0.8 + R + 0.002, 2.3);            // it starts on the table, in the sun, looking down the room
let yaw = -1.6, pitch = 0, yawWant = yaw, pitchWant = 0, speed = 0, sink = 0, bank = 0, flap = 0, perched = true;
let amp = 0, lean = 0, fold = 1;                        // wing beat, body tilt, how tucked the wings are: all eased, so nothing snaps
let touching = false, pressing = false, lastLook = -1e9;
const keys = new Set(), held = (...names) => names.some((n) => keys.has(n));

function free(p, r = R) {
  for (const s of solids) if (p.x > s[0] - r && p.x < s[3] + r && p.y > s[1] - r && p.y < s[4] + r && p.z > s[2] - r && p.z < s[5] + r) return false;
  const ax = Math.abs(p.x), az = Math.abs(p.z), roof = roofAt(p.z);
  if (ax < HX + 0.7 + r && az < HZ + 0.9 + r && p.y > roof - 0.2 - r && p.y < roof + 0.32 + r) return false;      // the roof
  if (ax > HX - r && ax < HX + T + r && az < HZ + T + r && p.y > H - r && p.y < roof + 0.3)                        // the gable ends...
    return p.x < 0 && Math.hypot(p.y - PORT.y, p.z) < PORT.r - 0.1;                                                // ...but for the round window
  return true;
}
const before = new THREE.Vector3(), probe = new THREE.Vector3();

function glide(dx, dy, dz) {                            // one axis at a time, so the bird slides along things; true if it came down on something
  before.copy(pos); let landed = false;
  pos.x += dx; if (!free(pos)) pos.x -= dx;
  pos.z += dz; if (!free(pos)) pos.z -= dz;
  pos.y += dy; if (!free(pos)) { pos.y -= dy; landed = dy < 0; }
  if (pos.y < R) { pos.y = R; landed = true; }
  pos.y = Math.min(pos.y, 30);
  const far = Math.hypot(pos.x, pos.z); if (far > FAR) { pos.x *= FAR / far; pos.z *= FAR / far; }
  if (!free(pos)) pos.copy(before);
  return landed;
}

function steer(dt) {                                    // true while nothing is asking the bird to flap
  const turn = held("ArrowLeft", "a") - held("ArrowRight", "d"), climb = held("ArrowUp", "w") - held("ArrowDown", "s");
  yawWant += turn * 1.7 * dt;
  pitchWant = Math.max(-0.9, Math.min(0.9, pitchWant + climb * 1.4 * dt));
  if (!climb && performance.now() - lastLook > 500) pitchWant *= Math.exp(-0.8 * dt);   // level out when left alone
  return !(held(" ") || pressing || touching);
}

// How to play, told a line at a time as you go.
const TIPS = [TOUCH ? "Hold a thumb down to fly" : "Hold Space to fly",
              TOUCH ? "Drag to steer" : "Move the mouse to steer, or use the arrow keys",
              "Pop the bubbles. Each one is a word of a resume",
              "In a hurry? Fly to the laptop on the desk",
              TOUCH ? "Let go to glide down and land" : "Let go of Space to glide down and land"];
let tipStep = -1, tipT = 0;
function tips(dt, gliding) {
  tipT += dt;
  if (tipStep >= TIPS.length) return;
  if (tipStep >= 0 && ![!gliding, tipT > 3.5, eaten > 0 || tipT > 7, tipT > 7, tipT > 1.5 && (perched || tipT > 9)][tipStep]) return;
  tipStep++; tipT = 0;
  tipEl.textContent = TIPS[tipStep] || ""; tipEl.classList.toggle("on", tipStep < TIPS.length);
}

function update(dt, now) {
  const ease = (k) => 1 - Math.exp(-k * dt);
  const gliding = state === "playing" ? steer(dt) : true;
  if (state === "playing") tips(dt, gliding);
  if (!gliding && perched) { perched = false; pitchWant = Math.max(pitchWant, 0.4); }   // a little hop into the air

  // The bird turns towards where you point it, at its own pace: the room never whips round.
  yawWant = Math.max(yaw - 1.2, Math.min(yaw + 1.2, yawWant));
  const turned = Math.max(-2.2 * dt, Math.min(2.2 * dt, (yawWant - yaw) * ease(5)));
  yaw += turned;
  if (gliding) pitchWant *= Math.exp(-2 * dt);
  pitch += (pitchWant - pitch) * ease(4);

  // Flapping holds height and speed. Let go and it glides: slower, sinking gently, flaring just before it lands.
  const low = !perched && (pos.y < R + 0.45 || !free(probe.copy(pos).setY(pos.y - 0.45)));
  const want = gliding ? (low ? 0.6 : 1.6) : held("Shift") ? 4.2 : 2.3;
  speed += (want - speed) * ease(gliding ? 1.3 : 1.7);
  sink += ((gliding ? -0.75 : 0) - sink) * ease(2.5);
  if (!perched) {
    const cp = Math.cos(pitch);
    const landed = glide(Math.sin(yaw) * cp * speed * dt, (Math.sin(pitch) * speed + sink) * dt, Math.cos(yaw) * cp * speed * dt);
    if (gliding && landed) { perched = true; speed = 0; sink = 0; }
  }

  amp += ((perched ? 0 : gliding ? (low ? 0.5 : 0.05) : pitch < -0.25 ? 0.15 : 0.6) - amp) * ease(gliding ? 3.5 : 6);
  flap += dt * (gliding && !low ? 5 : 14 + Math.max(0, pitch) * 8);
  fold += ((perched ? 1 : 0) - fold) * ease(perched ? 7 : 10);
  lean += ((perched || !gliding ? 0 : low ? -0.4 : -0.06) - lean) * ease(3);
  bank += (Math.max(-0.6, Math.min(0.6, -turned / Math.max(dt, 1e-3) * 0.4)) * (1 - fold) - bank) * ease(4);
  const a = 0.14 + Math.sin(flap) * amp;
  for (const w of wings) { w.hinge.rotation.z = w.s * (a * (1 - fold) - 0.3 * fold); w.hinge.rotation.y = w.s * -1.45 * fold; }
  bird.position.copy(pos); bird.position.y -= 0.05 * fold;
  bird.rotation.set(0, yaw, 0);
  body.rotation.set(-pitch * 0.8 + lean, Math.sin(now / 1500) * 0.3 * fold, bank);     // perched, it looks about
  body.position.y = -Math.sin(flap) * 0.02 * amp;
}

// The camera trails the bird steadily: level, a little behind the turn, and never with a wall in between.
const eye = new THREE.Vector3(), look = new THREE.Vector3(), lookAt = new THREE.Vector3(); let framed = false, camYaw = yaw, reachBack = 1;
function follow(dt) {
  const ease = (k) => framed ? 1 - Math.exp(-k * dt) : 1;
  camYaw += (yaw - camYaw) * ease(3.5);
  const p = pitch * 0.35, back = 1.5;
  eye.set(pos.x - Math.sin(camYaw) * Math.cos(p) * back, pos.y - Math.sin(p) * back + 0.6, pos.z - Math.cos(camYaw) * Math.cos(p) * back);
  let clear = 1;
  for (let i = 1; i <= 8; i++) if (!free(probe.lerpVectors(pos, eye, i / 8), 0.1)) { clear = (i - 1) / 8; break; }
  reachBack += (Math.max(0.12, clear) - reachBack) * ease(clear < reachBack ? 14 : 2);          // in quickly, back out slowly
  eye.lerpVectors(pos, eye, reachBack); eye.y = Math.max(0.15, eye.y);
  look.set(pos.x + Math.sin(camYaw) * 1.6, pos.y + 0.05 + Math.sin(pitch) * 0.8, pos.z + Math.cos(camYaw) * 1.6);
  camera.position.lerp(eye, ease(10)); lookAt.lerp(look, ease(10)); framed = true;
  camera.lookAt(lookAt);
}

// ---- flow --------------------------------------------------------------------------------------------------

function rest(title, sub) {
  titleEl.textContent = title; subEl.textContent = sub; hintEl.textContent = "";
  overlay.hidden = false; keys.clear(); touching = pressing = false; restAt = performance.now(); tipEl.classList.remove("on");
}
function pause() { if (state === "playing") { state = "ready"; rest("Resting.", ON); } }

function win() {
  state = "won"; endAt = performance.now(); keys.clear(); touching = pressing = false; tipEl.classList.remove("on");
  if (document.pointerLockElement) document.exitPointerLock();
  setTimeout(transpose, 1100);               // let the last word land in the line first
}

const settled = () => (state !== "won" || performance.now() - endAt > 1100 + WORDS.length * 55 + 1000) && performance.now() - restAt > 400;

function start() {
  if (state === "playing" || !settled()) return;
  if (state === "won") { finalEl.hidden = true; for (const s of lineEl.children) s.style.visibility = ""; }
  state = "playing"; overlay.hidden = true; tipEl.classList.toggle("on", tipStep >= 0 && tipStep < TIPS.length);
  grab();
}

function grab() {                            // take the mouse, where there is one
  if (TOUCH || document.pointerLockElement || !canvas.requestPointerLock) return;
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}

function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  update(dt, now); follow(dt);
  const d = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) d.setXYZ(i, dustHome[i * 3] + Math.sin(now / 2600 + i) * 0.12, dustHome[i * 3 + 1] + Math.sin(now / 3400 + i * 1.7) * 0.1, dustHome[i * 3 + 2] + Math.cos(now / 3000 + i * 0.6) * 0.12);
  d.needsUpdate = true;
  bubblesTick(now, dt);
  fire.intensity = 1.5 + Math.sin(now / 90) * 0.15 + Math.sin(now / 37) * 0.1;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---- input -------------------------------------------------------------------------------------------------

const MOVE = new Set(["w", "a", "s", "d", " ", "Shift", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);
const look2 = (dx, dy, k) => { yawWant -= dx * k; pitchWant = Math.max(-0.9, Math.min(0.9, pitchWant - dy * k)); if (dy) lastLook = performance.now(); };

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (MOVE.has(k)) e.preventDefault();
  if (state === "playing") { if (MOVE.has(k)) keys.add(k); return; }
  if (e.repeat || k === "Escape" || k === "Tab") return;
  start();
  if (state === "playing" && MOVE.has(k)) keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
addEventListener("blur", () => keys.clear());

// The mouse steers once the page has hold of it. Escape lets go.
document.addEventListener("mousedown", () => { if (state === "playing") { grab(); pressing = true; } else start(); });    // holding the button flies, too
document.addEventListener("mouseup", () => { pressing = false; });
document.addEventListener("mousemove", (e) => { if (state === "playing" && document.pointerLockElement === canvas) look2(e.movementX, e.movementY, 0.002); });
document.addEventListener("pointerlockchange", () => {
  const now = document.pointerLockElement === canvas;
  if (locked && !now) pause();
  locked = now;
});
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
document.addEventListener("contextmenu", (e) => e.preventDefault());

// Phones: a thumb down flies, dragging it steers, lifting it lets the bird settle.
let finger = null, at0;
const stage = $("stage");
stage.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (state !== "playing" || finger !== null) return;
  const t = e.changedTouches[0]; finger = t.identifier; at0 = { x: t.clientX, y: t.clientY }; touching = true;
}, { passive: false });
stage.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === finger) { look2(t.clientX - at0.x, t.clientY - at0.y, 0.006); at0 = { x: t.clientX, y: t.clientY }; }
}, { passive: false });
const lift = (e) => {
  for (const t of e.changedTouches) if (t.identifier === finger) { finger = null; touching = false; }
  if (state !== "playing" && e.type === "touchend") start();
};
stage.addEventListener("touchend", lift);
stage.addEventListener("touchcancel", lift);

addEventListener("resize", size);
size(); renderLine();
for (let i = 0; i < 500; i++) bubblesTick(0, 1 / 30);
requestAnimationFrame(frame);
</script>
</body>
</html>
